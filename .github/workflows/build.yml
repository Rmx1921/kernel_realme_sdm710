name: Kernel CI Build

on:
  push:
    branches:
      - spiral
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive
      KBUILD_BUILD_USER: Rmx1921
      KBUILD_BUILD_HOST: circleci
      BOT_TOKEN: 1445481247:AAFmjxDbbXAEFjAgYdyeVj6ZKAq-obPV_64
      CHAT_ID: 338913217
      COMPILER: ProtonClang-13.0

    steps:
      - name: Checkout the current repo
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev zip git \
            build-essential python3 libelf-dev \
            p7zip-full tzdata libstdc++6

      - name: Clone Compiler (proton-clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/proton-clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Rmx1921/Anykernel $HOME/AnyKernel3

      - name: Notify Telegram (Started)
        run: |
          MESSAGE="<code>𝕊ℙ𝕀ℝ𝔸𝕃</code>%0ABuild: <code>CI</code>%0ADevice: <code>Realme XT(RMX1921)</code>%0ACompiler: <code>${{ env.COMPILER }}</code>%0ABranch: <code>${{ github.ref_name }}</code>%0ACommit: <code>${{ github.sha }}</code>%0A<i>Build started on GitHub Actions...</i>"
          curl -s -X POST https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="$MESSAGE" -d parse_mode=HTML

      - name: Build Kernel
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export KEBABS=$(($(nproc --all) * 2))
          export OUT_DIR=out

          # Make defconfig
          make ARCH=arm64 \
            O=$OUT_DIR \
            RMX1921_defconfig \
            -j$KEBABS

          # Full Kernel Build
          make ARCH=arm64 \
            O=$OUT_DIR \
            CC="clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            -j$KEBABS \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        if: success()
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/
          cd $HOME/AnyKernel3
          DATE=$(date +"%d.%m.%y")
          ZIP_NAME="Spiral-${{ github.run_number }}-${DATE}.zip"
          zip -r9 "$ZIP_NAME" . -x '*.git*'
          ZIP_SIZE=$(ls -l "$ZIP_NAME" | awk '{print $5}')
          if (($(($ZIP_SIZE / 1048576)) <= 5)); then
            echo "Build Error: Kernel zip size is too small ($ZIP_SIZE bytes)!"
            exit 1
          fi
          echo "ZIP_PATH=$HOME/AnyKernel3/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Notify Telegram (Success)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="Kernel compiled successfully for SPIRAL" -d parse_mode=HTML
          curl -F chat_id=${{ env.CHAT_ID }} -F document=@"${{ env.ZIP_PATH }}" https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument

      - name: Notify Telegram (Failure)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage -d chat_id=${{ env.CHAT_ID }} -d text="Build Error!!"

      - name: Upload Kernel Zip as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: Upload Build Log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 3