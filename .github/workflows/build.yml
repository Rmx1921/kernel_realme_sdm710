name: Kernel CI Build

on:
  push:
    branches:
      - spiral  # or whichever branch you want to trigger the build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive
      KBUILD_BUILD_USER: Rmx1921
      KBUILD_BUILD_HOST: github

    steps:
      - name: Checkout the current repo
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev zip git \
            build-essential python3 libelf-dev

      - name: Clone Compiler (proton-clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/proton-clang

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Rmx1921/Anykernel $HOME/AnyKernel3

      - name: Build Kernel
        run: |
          export PATH="/usr/bin:$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTLD=/usr/bin/ld.bfd
          export LD=/usr/bin/ld.bfd

          make O=out vendor/RMX1921_defconfig

          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCC=$HOSTCC \
            HOSTCXX=$HOSTCXX \
            HOSTLD=$HOSTLD \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb $HOME/AnyKernel3/
          cd $HOME/AnyKernel3
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="Kernel-RMX1921-${BUILD_TIME}.zip"
          zip -r9 "$ZIP_NAME" . -x '*.git*'
          echo "ZIP_PATH=$HOME/AnyKernel3/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Zip as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: Upload Build Log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 3



